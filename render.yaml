services:
  - type: web
    name: professors-vet-care
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn vetcare.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
